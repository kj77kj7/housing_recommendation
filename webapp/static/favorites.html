<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>집찾봇 — 찜 목록</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app-page">

  <!-- ══ 사이드바 ══════════════════════════════════════ -->
  <nav id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🏠</div>
      <div class="brand-text">
        <div class="brand-name">집찾봇</div>
        <div class="brand-sub">청년 주거 추천</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">메인</div>
      <a class="nav-item" href="/">
        <span class="nav-left"><span class="nav-icon">💬</span> 챗봇으로 찾기</span>
      </a>
      <a class="nav-item" href="/recommendation">
        <span class="nav-left"><span class="nav-icon">🏠</span> 주거 추천</span>
        <span class="nav-badge" id="sidebar-rec-badge" style="display:none"></span>
      </a>
      <a class="nav-item disabled" href="#">
        <span class="nav-left"><span class="nav-icon">🗺️</span> 지도뷰</span>
      </a>
    </div>

    <div class="sidebar-bottom">
      <div class="sidebar-label">계정</div>
      <a class="nav-item" href="/mypage">
        <span class="nav-left"><span class="nav-icon">👤</span> 내 정보</span>
      </a>
      <a class="nav-item active" href="/favorites">
        <span class="nav-left"><span class="nav-icon">❤️</span> 찜 목록</span>
        <span class="nav-badge" id="sidebar-fav-badge" style="display:none"></span>
      </a>
      <a class="nav-item nav-item--danger" href="#" onclick="handleLogout(event)">
        <span class="nav-left"><span class="nav-icon">🚪</span> 로그아웃</span>
      </a>
      <div class="user-chip">
        <div class="user-avatar">🐻</div>
        <div>
          <div class="user-name" id="sidebar-username">사용자님</div>
          <div class="user-sub">청년 주거 탐색 중</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ══ 메인 ══════════════════════════════════════ -->
  <main id="page-main">
    <header class="page-header">
      <h1 class="page-title">찜 목록</h1>
      <button class="page-noti-btn" aria-label="알림">🔔</button>
    </header>

    <div class="page-body">
      <div id="fav-list">
        <div class="fav-empty">찜한 매물을 불러오는 중…</div>
      </div>
    </div>
  </main>

  <!-- ══ 매물 상세 모달 ══════════════════════════════════ -->
  <div id="property-modal-overlay" class="property-modal-overlay" style="display:none" aria-hidden="true">
    <div class="property-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">매물 상세</span>
        <button class="modal-close-btn" id="modal-close-btn" aria-label="닫기">✕</button>
      </div>
      <div class="property-summary-card">
        <div class="property-icon-box">🏢</div>
        <div class="property-summary-info">
          <div class="property-address" id="modal-address"></div>
          <div class="property-meta" id="modal-meta"></div>
          <div class="property-deposit" id="modal-deposit"></div>
        </div>
        <div class="property-summary-tags" id="modal-tags"></div>
      </div>

      <div class="modal-section-title">💸 예상 생활비</div>
      <div class="modal-grid-2">
        <div class="expense-receipt">
          <div class="expense-receipt-header">
            <div class="expense-receipt-title-row">
              <div class="expense-receipt-title">서울살이 생활비 영수증</div>
              <span class="expense-receipt-icon">🧾</span>
            </div>
            <div class="expense-receipt-subtitle" id="modal-expense-subtitle"></div>
            <div class="expense-receipt-date" id="modal-expense-date"></div>
          </div>
          <div class="expense-receipt-body" id="modal-receipt-body">
            <div class="expense-skeleton">
              <div class="skeleton-line skeleton-line--lg"></div>
              <div class="skeleton-line"></div>
              <div class="skeleton-line"></div>
              <div class="skeleton-line"></div>
              <div class="skeleton-line skeleton-line--lg"></div>
            </div>
          </div>
        </div>
        <div class="comparison-card">
          <div class="comparison-card-title">📊 동네별 생활비 비교</div>
          <div id="modal-comparison-body">
            <div class="expense-skeleton">
              <div class="skeleton-line"></div>
              <div class="skeleton-line"></div>
              <div class="skeleton-line"></div>
              <div class="skeleton-line"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="policy-section">
        <div class="policy-section-header">
          <div class="policy-section-header-left">
            <div class="policy-section-title">🏛️ 청년정책 맞춤 안내</div>
            <div class="policy-section-subtitle" id="modal-policy-subtitle"></div>
            <div class="policy-section-property-name" id="modal-policy-property-name"></div>
          </div>
          <div class="policy-savings-pill" id="modal-policy-savings"></div>
        </div>
        <div class="policy-list" id="modal-policy-list"></div>
        <button class="policy-show-more" id="modal-policy-show-more" style="display:none" type="button">더 보기</button>
        <div class="policy-empty" id="modal-policy-empty" style="display:none">
          이 매물에 적용 가능한 청년정책이 없어요.
        </div>
      </div>

      <div class="modal-footer-note">
        ※ 정책 정보는 화이트리스트(20건) 기준이며, 정확한 자격·신청 방법은 각 정책 신청 URL에서 확인하세요.
      </div>
    </div>
  </div>

<script>
  (function() {
    if (!localStorage.getItem('token')) {
      location.href = '/login';
    }
  })();
  function handleLogout(e) {
    e.preventDefault();
    localStorage.removeItem('token');
    localStorage.removeItem('nickname');
    localStorage.removeItem('user_id');
    location.href = '/login';
  }
</script>
<script src="/config.js"></script>
<script src="/property-modal.js"></script>
<script src="/favorites.js"></script>
</body>
</html>
