<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>집찾봇 — 청년 주거 추천</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">

  <!-- ══ 사이드바 ══════════════════════════════════════ -->
  <nav id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🏠</div>
      <div class="brand-text">
        <div class="brand-name">집찾봇</div>
        <div class="brand-sub">청년 주거 추천</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">메인</div>
      <a class="nav-item active" href="#">
        <span class="nav-left"><span class="nav-icon">💬</span> 챗봇으로 찾기</span>
      </a>
      <a class="nav-item" id="nav-rec" href="/recommendation">
        <span class="nav-left"><span class="nav-icon">🏠</span> 주거 추천</span>
        <span class="nav-badge" id="nav-rec-badge" style="display:none"></span>
      </a>
      <a class="nav-item" id="nav-map" href="/recommendation?view=map">
        <span class="nav-left"><span class="nav-icon">🗺️</span> 지도뷰</span>
      </a>
    </div>

    <div id="current-conditions" style="display:none">
      <div class="sidebar-label">현재 검색 조건</div>
      <div id="condition-chips"></div>
    </div>

    <div class="sidebar-bottom">
      <div class="sidebar-label">계정</div>
      <a class="nav-item" href="/mypage">
        <span class="nav-left"><span class="nav-icon">👤</span> 내 정보</span>
      </a>
      <a class="nav-item" href="/favorites">
        <span class="nav-left"><span class="nav-icon">❤️</span> 찜 목록</span>
        <span class="nav-badge" id="sidebar-fav-badge" style="display:none"></span>
      </a>
      <a class="nav-item nav-item--danger" href="#" onclick="handleLogout(event)">
        <span class="nav-left"><span class="nav-icon">🚪</span> 로그아웃</span>
      </a>
      <div class="user-chip">
        <div class="user-avatar">🐻</div>
        <div>
          <div class="user-name" id="sidebar-username">사용자님</div>
          <div class="user-sub">청년 주거 탐색 중</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ══ 채팅 영역 ══════════════════════════════════════ -->
  <section id="chat-area">
    <div id="chat-header">
      <span id="chat-title">챗봇으로 찾기</span>
      <div class="chat-header-actions">
        <button id="reset-btn" onclick="resetChat()">새 추천 시작</button>
        <button id="result-btn" onclick="scrollToResults()">주거 추천 결과 보기 →</button>
      </div>
    </div>

    <div id="messages"></div>

    <div id="quick-options"></div>

    <div id="input-area">
      <textarea
        id="user-input"
        placeholder="메시지를 입력하세요..."
        rows="1"
      ></textarea>
      <button id="send-btn" aria-label="전송">&#9658;</button>
    </div>
  </section>

  <!-- ══ 우측 패널 ══════════════════════════════════════ -->
  <aside id="right-panel">
    <div id="panel-body">

      <!-- 조건 입력 진행도 -->
      <div class="panel-section">
        <div class="panel-section-title">조건 입력 진행도</div>
        <div id="progress-list"></div>
      </div>

      <!-- 입력된 조건 -->
      <div class="panel-section">
        <div class="panel-section-title">입력된 조건</div>
        <div id="condition-table"></div>
      </div>


    </div>
  </aside>

</div>
<script>
  // 로그인 토큰 없으면 /login 으로 리다이렉트
  (function() {
    if (!localStorage.getItem('token')) {
      location.href = '/login';
    } else {
      const nick = localStorage.getItem('nickname');
      if (nick) {
        document.addEventListener('DOMContentLoaded', function() {
          const el = document.getElementById('sidebar-username');
          if (el) el.textContent = nick + '님';
        });
      }
      // 찜 개수 배지 로드
      const userId = parseInt(localStorage.getItem('user_id') || '0');
      const token  = localStorage.getItem('token');
      if (userId && token) {
        fetch('/favorites/keys?user_id=' + userId, {
          headers: { 'Authorization': 'Bearer ' + token }
        }).then(r => r.ok ? r.json() : { keys: [] }).then(d => {
          const n = (d.keys || []).length;
          const badge = document.getElementById('sidebar-fav-badge');
          if (badge && n > 0) { badge.textContent = n; badge.style.display = ''; }
        }).catch(() => {});
      }
    }
  })();

  function handleLogout(e) {
    e.preventDefault();
    // 인증 데이터
    localStorage.removeItem('token');
    localStorage.removeItem('nickname');
    localStorage.removeItem('user_id');
    localStorage.removeItem('rec_session_id');
    // 챗봇 세션 + 추천결과 전체 초기화
    sessionStorage.removeItem('chat_history');
    sessionStorage.removeItem('rec_results_cache');
    sessionStorage.removeItem('chat_session_id');
    location.href = '/login';
  }
</script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
